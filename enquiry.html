<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Link to the website stylesheet -->
<link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Johannesburg SPCA  | Enquiry</title>
</head>
<body>
    <body>

    <!-- Website header and navigation -->
    <header>
        <h1>Johannesburg SPCA</h1>

        <!-- Main navigation menu -->
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="services.html">Services</a>
            <a href="enquiry.html">Enquiry</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <!-- Main enquiry content -->
    <main>

        <!-- Enquiry introduction -->
        <section>
            <h2>Make an Enquiry</h2>

            <p>
                Complete the form below if you would like more information
                about adoption, volunteering, donations or animal welfare.
            </p>
        </section>

        <!-- Enquiry form -->
        <section>
            <form>

                <!-- Name field -->
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <br><br>

                <!-- Email field -->
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <br><br>

                <!-- Telephone field -->
                <label for="phone">Telephone Number:</label>
                <input type="tel" id="phone" name="phone">

                <br><br>

                <!-- Enquiry type -->
                <label for="enquiry-type">Type of Enquiry:</label>
                <select id="enquiry-type" name="enquiry-type">

                    <option value="">Please select</option>
                    <option value="adoption">Adoption</option>
                    <option value="volunteering">Volunteering</option>
                    <option value="donation">Donation</option>
                    <option value="animal-welfare">Animal Welfare</option>

                </select>

                <br><br>

                <!-- Message field -->
                <label for="message">Message:</label>
                <br>
                <textarea id="message" name="message" rows="6" cols="40"></textarea>

                <br><br>

                <!-- Submit button -->
                <button type="submit">Submit Enquiry</button>

            </form>
        </section>

    </main>

    <!-- Website footer -->
    <footer>
        <p>&copy; 2026 Johannesburg SPCA. All rights reserved.</p>
    </footer>
    <!-- Link to the JavaScript file -->
<script src="js/script.js"></script>
    

</body>
    
</body>
</html>
